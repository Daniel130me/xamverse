# XamVerse gate — every push/PR to the engine + prototype runs these jobs.
#
# Job matrix per docs/phase2/TESTING.md §3:
#   rust-test   — cargo test --workspace (SQLCipher + OpenSSL are vendored,
#                 so no system crypto packages are needed; a C compiler and
#                 perl/make for the OpenSSL build are preinstalled on
#                 ubuntu-latest runners)
#   rust-clippy — workspace lints with deny(warnings); unwrap/expect stay
#                 enforced in library code, test cfg is exempted per crate
#   rust-fmt    — formatting check
#   ts-check    — prototype typecheck + lint + vitest behavioural pin
#   engine-e2e  — the scripted two-peer CLI demo (real TCP, real engines)
#
# The desktop bundling jobs live in desktop.yml (they need GUI libraries and
# are scaffold-gated).

name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  ts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # The engine SDK is an independent package with its own deps/tests.
      - run: bun install
        working-directory: packages/engine-sdk
      - run: bun run typecheck && bun run test
        working-directory: packages/engine-sdk

  engine-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p xamverse-peer
      - run: scripts/engine-e2e.sh
