[package]
name = "xamverse-shell"
description = "XamVerse offline-first desktop examination infrastructure"
version = "0.1.1"
edition = "2021"
license = "UNLICENSED"
authors = ["Daniel130me <kosokodaniel@gmail.com>"]
repository = "https://github.com/Daniel130me/xamverse"

# This package is deliberately EXCLUDED from the parent
# workspace (root Cargo.toml `exclude`) — it needs GUI system libraries that
# headless build machines do not have. Excluded packages cannot use
# `workspace = true` inheritance, so every field and dependency is explicit.
# It is built by the dedicated `desktop.yml` workflow and by developers with
# a desktop toolchain:  cd src-tauri && bun x @tauri-apps/cli dev
#
# The dedicated desktop workflow builds this package on Windows and macOS.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.41", features = ["rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v7", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The desktop shell is the production composition root. Keep engine logic in
# the focused crates; commands below only validate/authorize and delegate.
xamverse-core = { path = "../crates/xamverse-core" }
xamverse-storage = { path = "../crates/xamverse-storage" }
xamverse-security = { path = "../crates/xamverse-security" }
xamverse-sync = { path = "../crates/xamverse-sync" }
xamverse-audit = { path = "../crates/xamverse-audit" }
xamverse-web = { path = "../crates/xamverse-web" }

# Mirror of the workspace lint policy (workspace inheritance is unavailable
# in an excluded package) — keep in sync with the root Cargo.toml.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
