[package]
name = "xamverse-shell"
description = "XamVerse desktop shell (Tauri 2) — hosts the Phase 3 UI and embeds the engine"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Daniel130me <kosokodaniel@gmail.com>"]
repository = "https://github.com/Daniel130me/xamverse"

# NOTE(scaffold): this package is deliberately EXCLUDED from the parent
# workspace (root Cargo.toml `exclude`) — it needs GUI system libraries that
# headless build machines do not have. Excluded packages cannot use
# `workspace = true` inheritance, so every field and dependency is explicit.
# It is built by the dedicated `desktop.yml` workflow and by developers with
# a desktop toolchain:  cd src-tauri && bun x @tauri-apps/cli dev
#
# Phase 3 wiring points (do not improvise — see docs/phase2/):
#   * ENGINE_API.md        — the command surface this shell must expose
#                            (`engine_<namespace>_<op>`), 1:1 with the SDK
#   * PHASE3_INTEGRATION_GUIDE.md — embed xamverse-core via Engine::init,
#                            OS-keychain SecureKeyStore injection
#   * UPDATES_AND_INSTALLERS.md §7 — bundling + code-signing checklist

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mirror of the workspace lint policy (workspace inheritance is unavailable
# in an excluded package) — keep in sync with the root Cargo.toml.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
